server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: flashcard-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashcard_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres} # <-- HÃY ĐỔI MẬT KHẨU POSTGRES CỦA BẠN TẠI ĐÂY NẾU KHÁC 'postgres'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none # Vì bạn đã chạy file schema.sql tạo bảng trong pgAdmin rồi, để 'none' để tránh xung đột Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

# Cấu hình JWT Token nội bộ
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # Chuỗi 256-bit an toàn
  expiration-ms: 86400000 # 24 giờ (Access Token)
  refresh-expiration-ms: 604800000 # 7 ngày (Refresh Token)

# Cấu hình AI Service (Python FastAPI)
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
